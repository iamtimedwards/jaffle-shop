sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: comes in from postgres
    config: 
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 14
          period: day
        loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: raw customers data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null  
        config:
          freshness: null
      - name: orders
        description: raw orders data
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null  