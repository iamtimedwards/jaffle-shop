sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        columns:
          - name: id
            description: primary key
            data_tests:
              - unique
              - not_null
          - name: paymentmethod
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - credit_card
                      - bank_transfer
                      - coupon
                      - gift_card